<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прорахунок пакування</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F2; --sheet:#FFFFFF; --ink:#1B2230; --muted:#5B6473; --line:#D5DAD8;
  --cyan:#0092C8; --magenta:#C8215F; --yellow:#E8B500; --kraft:#B4874F; --okbg:#E6F4EC; --ok:#1E7A45;
  --warnbg:#FFF6D6; --stopbg:#FCE4EC;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151A22; --sheet:#1D2430; --ink:#E7EAEE; --muted:#9AA3B0; --line:#2E3746;
    --cyan:#3BB6E6; --magenta:#EC5B91; --yellow:#F2C94C; --kraft:#CFA36E; --okbg:#173326; --ok:#6FD39A;
    --warnbg:#3A3218; --stopbg:#3D1B28;
  }
}
:root[data-theme="dark"]{
  --paper:#151A22; --sheet:#1D2430; --ink:#E7EAEE; --muted:#9AA3B0; --line:#2E3746;
  --cyan:#3BB6E6; --magenta:#EC5B91; --yellow:#F2C94C; --kraft:#CFA36E; --okbg:#173326; --ok:#6FD39A;
  --warnbg:#3A3218; --stopbg:#3D1B28;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

.strip{display:flex;height:14px}
.strip i{flex:1}
header.top{padding:22px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:clamp(24px,5vw,34px);letter-spacing:-.01em}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn.small{padding:5px 10px;font-size:14px}

/* branch switch: single control, sticky */
.switch{display:flex;margin:0 0 18px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.switch button{flex:1;border:0;background:transparent;padding:13px;font-weight:700;font-family:var(--display);font-size:15px;cursor:pointer;color:var(--ink);opacity:.5}
.switch button[aria-pressed="true"]{opacity:1}
.switch button.b[aria-pressed="true"]{background:var(--cyan);color:#fff}
.switch button.p[aria-pressed="true"]{background:var(--magenta);color:#fff}

/* intake: тираж */
.intake{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.intake h2{font-size:18px;display:flex;gap:12px;align-items:center;margin-bottom:2px}
.num{font-family:var(--display);font-size:13px;min-width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;border:2px solid currentColor;flex:none}
.qtyquick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.qtyquick button{border:1.5px solid var(--line);background:var(--paper);border-radius:20px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.qtyquick button.active{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* branches */
.cols{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
.cols[data-show="box"] .col.bag,.cols[data-show="bag"] .col.box{display:none}
.col{--acc:var(--cyan)}
.col.bag{--acc:var(--magenta)}
.colhead{border-top:6px solid var(--acc);background:var(--sheet);border-radius:0 0 12px 12px;padding:16px 18px;margin-bottom:14px}
.colhead h2{font-size:22px;color:var(--acc)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{background:var(--sheet);border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:16px 18px}
.stephead{display:flex;align-items:center;gap:12px}
.stephead h3{font-size:16px;flex:1;font-weight:500}
.stephead .num{color:var(--acc)}
.hint{color:var(--muted);font-size:14.5px;margin:10px 0 0}
.hint:empty{display:none}
.hint p{margin:0 0 6px} .hint b{color:var(--ink);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.fields:empty{display:none}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f.checkbox{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer}
.f.checkbox input{width:18px;height:18px;flex:none;accent-color:var(--acc,var(--ink))}
.f[hidden]{display:none}
.f input,.f select{border:1.5px solid var(--line);background:var(--paper);border-radius:7px;padding:8px 10px;font-size:15px;width:100%}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow button{border:1.5px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chiprow button.active{background:var(--acc,var(--ink));color:#fff;border-color:var(--acc,var(--ink))}
.f input:focus,.f select:focus{border-color:var(--acc);outline:none}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px}
.note.warn{background:var(--warnbg)}
.note.info{background:var(--paper)}
.mats{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.mat{border-radius:8px;padding:10px;font-size:13px;border:1.5px solid var(--line)}
.mat b{display:block;font-size:14px;margin-bottom:2px}
.mat .sw{height:22px;border-radius:4px;margin-bottom:8px;border:1px solid var(--line)}
.calc{margin-top:12px;border:1.5px dashed var(--acc);border-radius:8px;padding:12px}
.calc .big{font-family:var(--display);font-size:24px;color:var(--acc)}
.calc table{border-collapse:collapse;margin-top:8px;font-size:14px;width:100%}
.calc td{padding:4px 0;border-top:1px solid var(--line)}
.calc td:last-child{text-align:right}
.swatches{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.swatches figure{margin:0;flex:1;min-width:120px}
.swatches .box{height:74px;border-radius:6px}
.swatches figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.sw-ok{background:#1F8A4C}
.sw-bad{background:
  repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 3px,transparent 3px 9px),
  linear-gradient(100deg,#4E8A45 0%,#2F7A5A 30%,#5A8F3A 55%,#2C6E52 80%,#4F8646 100%)}
.tz{margin-top:14px;background:var(--ink);color:var(--sheet);border-radius:12px;padding:16px 18px}
.tz header{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.tz h3{font-size:16px}
.tz pre{white-space:pre-wrap;font:14px/1.6 var(--body);margin:10px 0 0;user-select:text;-webkit-user-select:text}
.tz .btn{border-color:var(--sheet);color:var(--sheet)}
.tz .btn:hover{background:var(--sheet);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="strip" aria-hidden="true">
  <i style="background:#00A0D8"></i><i style="background:#E0107A"></i><i style="background:#FFE000"></i><i style="background:#1A1A1A"></i>
  <i style="background:#7FD0EC"></i><i style="background:#F088BD"></i><i style="background:#FFF080"></i><i style="background:#8C8C8C"></i>
  <i style="background:#00A0D8"></i><i style="background:#E0107A"></i><i style="background:#FFE000"></i><i style="background:#1A1A1A"></i>
</div>
<div class="wrap">
<header class="top">
  <h1>Прорахунок пакування</h1>
  <button class="btn small" id="reset">Очистити все</button>
</header>

<div class="switch" role="group" aria-label="Що пакуємо">
  <button class="b" data-show="box" aria-pressed="true">Коробка</button>
  <button class="p" data-show="bag" aria-pressed="false">Пакет</button>
</div>

<section class="intake" aria-label="Тираж">
  <h2><span class="num">1</span>Тираж</h2>
  <div class="qtyquick" id="qtyQuick">
    <button type="button" data-v="500">500</button><button type="button" data-v="1000">1 000</button>
    <button type="button" data-v="2000">2 000</button><button type="button" data-v="3000">3 000</button>
    <button type="button" data-v="4000">4 000</button><button type="button" data-v="5000">5 000</button>
    <button type="button" data-v="6000">6 000</button><button type="button" data-v="8000">8 000</button>
    <button type="button" data-v="10000">10 000</button><button type="button" data-v="12000">12 000</button>
    <button type="button" data-v="15000">15 000</button><button type="button" data-v="20000">20 000</button>
  </div>
  <div class="fields" style="grid-template-columns:1fr"><label class="f">Інший тираж, шт<input type="number" id="qty" min="0" inputmode="numeric" placeholder="напр. 5000"></label></div>
</section>

<div class="cols" id="cols" data-show="box">
  <section class="col box" data-br="box"></section>
  <section class="col bag" data-br="bag"></section>
</div>
</div>

<script src="formats.js"></script>
<script>
/* ====== НАЛАШТУВАННЯ (легко змінити) ====== */
const CLICHE_PRICE = 14.5;  // кліше, грн за 1 см²
const SHEET_FORMATS = ['1000×700','900×640','50×70','64×45','35×50','32×45','64×300','700×333','32×30','35×333'];

/* ====== КОНФІГ КРОКІВ ====== */
const MAT_BOX_OPTS = ['215 г','235 г','250 г','270 г','300 г','Крафт'];
const MAT_BAG_OPTS = ['215 г','250 г','Крейдований'];
const MAT_BOX_HINT = '';
const MAT_BAG_HINT = `<p>Картон 215 г — стандарт: твердий, міцний, дешевий, жовтуватий відтінок. 250 г щільніший і дорожчий. Крейдований — білий, м'який, дорогий.</p>
<div class="note warn"><b>Увага:</b> крейдований картон не порівнюйте з 215 г лише за щільністю: за твердістю він інший.</div>`;

const PRINT_HINT = `<p>Друк обираємо окремо зовні та всередині: немає / CMYK / пантони / CMYK + пантони разом, і скільки фарб на цій стороні.</p>
<p><b>Пантони</b> — кожен колір окремо, дорожче; фони обов'язково пантоном.</p>`;
const PRINT_EXTRA = `<div class="swatches">
  <figure><div class="box sw-ok"></div><figcaption>Так виглядає в макеті</figcaption></figure>
  <figure><div class="box sw-bad"></div><figcaption>Так може вийти в CMYK: смуги, нерівний тон</figcaption></figure>
</div>`;

const LAM_OPTS = ['Без ламінації','Матова','Глянцева','Софт-тач','Металізована: срібло','Металізована: золото','Кольорова (інша)'];
const EMB_OPTS = ['Без тиснення','Сліпе','Фольга: срібло','Фольга: золото','Фольга: інший колір'];
const EMB_OUT = {'Сліпе':'сліпе тиснення','Фольга: срібло':'срібною плівкою','Фольга: золото':'золотою плівкою','Фольга: інший колір':'кольоровою плівкою'};
const PRINT_SIDE_OPTS = ['Немає','CMYK','Пантони','CMYK + Пантони'];

const fmtOpts=br=>(FORMATS[br]||[]).map(f=>f.name);
const isOther=v=>!!v.manual;
const FORMAT_GROUPS={
  box:FORMAT_CATS.map(g=>({label:g.cat,opts:g.items.map(i=>i.name)})),
  bag:[{label:null,opts:fmtOpts('bag')}]
};
const PARTS_OPTS=['2 деталі: кришка + дно','1 деталь (суцільна)'];
const GLUE_NONE_CATS=['КД Низька','КД Висока','Самозбірна висока','Самозбірна низька','Самозбірна MINI','WOК/Салат'];
const GLUE_FIXED_CATS=['Пенал'];
const GLUE_DEFAULT1_CATS=['Лодочка','Коробка із язичками','Дитяче Меню','Кебаб','Інші'];
const OTHER_CAT='Своя категорія';
const CAT_PARTS={'КД Низька':2,'КД Висока':2,'Пенал':2};
const partsOf=v=>v.parts===PARTS_OPTS[1]?1:2;

const LAM_OUT = {'Матова':'матова','Глянцева':'глянцева','Софт-тач':'софт-тач','Металізована: срібло':'срібна','Металізована: золото':'золота','Кольорова (інша)':'кольорова'};
function lamFields(which,labelPrefix,outDefault,inDefault){
  const lp=labelPrefix?labelPrefix+': ':'';
  const out={k:'lam'+which+'Out',label:lp+'Ламінація зовні',type:'select',opts:LAM_OPTS};
  if(outDefault) out.default=outDefault;
  const inn={k:'lam'+which+'In',label:lp+'Ламінація всередині',type:'select',opts:LAM_OPTS};
  if(inDefault) inn.default=inDefault;
  return [out,inn];
}
const LAM_FIELDS_1=lamFields('','',undefined,'Глянцева');
const LAM_FIELDS_2=[...lamFields('Lid','Кришка'),...lamFields('Bot','Дно',undefined,'Глянцева')];
const LAM_FIELDS_BAG=lamFields('','','Матова');
const EMB_FIELDS_1=[
  {k:'emb',label:'Тип тиснення',type:'select',opts:EMB_OPTS},
  {k:'embW',label:'Розмір тиснення: ширина, см',type:'number',ph:'5',show:v=>v.emb&&v.emb!==EMB_OPTS[0]},
  {k:'embH',label:'Розмір тиснення: висота, см',type:'number',ph:'3',show:v=>v.emb&&v.emb!==EMB_OPTS[0]},
  {k:'lac',label:'Вибірковий лак',type:'checkbox'}];
const EMB_FIELDS_2=[
  {k:'embLid',label:'Кришка: тип тиснення',type:'select',opts:EMB_OPTS},
  {k:'embLidW',label:'Кришка: ширина, см',type:'number',ph:'5',show:v=>v.embLid&&v.embLid!==EMB_OPTS[0]},
  {k:'embLidH',label:'Кришка: висота, см',type:'number',ph:'3',show:v=>v.embLid&&v.embLid!==EMB_OPTS[0]},
  {k:'lacLid',label:'Кришка: вибірковий лак',type:'checkbox'},
  {k:'embBot',label:'Дно: тип тиснення',type:'select',opts:EMB_OPTS},
  {k:'embBotW',label:'Дно: ширина, см',type:'number',ph:'5',show:v=>v.embBot&&v.embBot!==EMB_OPTS[0]},
  {k:'embBotH',label:'Дно: висота, см',type:'number',ph:'3',show:v=>v.embBot&&v.embBot!==EMB_OPTS[0]},
  {k:'lacBot',label:'Дно: вибірковий лак',type:'checkbox'}];
const MAT_FIELDS_1=[{k:'mat',label:'Картон',type:'select',opts:MAT_BOX_OPTS}];
const MAT_FIELDS_2=[
  {k:'matLid',label:'Кришка: картон',type:'select',opts:MAT_BOX_OPTS},
  {k:'matBot',label:'Дно: картон',type:'select',opts:MAT_BOX_OPTS}];
function printFields(which,labelPrefix){
  const lp=labelPrefix?labelPrefix+': ':'';
  const side=(dir,dirLabel)=>[
    {k:'print'+which+dir,label:lp+'Друк '+dirLabel,type:'select',opts:PRINT_SIDE_OPTS},
    {k:'print'+which+dir+'CmykN',label:lp+dirLabel+': CMYK фарб',type:'chips',opts:[1,2,3,4],show:v=>{const t=v['print'+which+dir];return t==='CMYK'||t==='CMYK + Пантони'}},
    {k:'print'+which+dir+'PmsN',label:lp+dirLabel+': пантонів',type:'chips',opts:[1,2,3,4],show:v=>{const t=v['print'+which+dir];return t==='Пантони'||t==='CMYK + Пантони'}}
  ];
  return [...side('Out','зовні'),...side('In','всередині')];
}
const PRINT_FIELDS_1=printFields('','');
const PRINT_FIELDS_2=[...printFields('Lid','Кришка'),...printFields('Bot','Дно')];

const STEPS = [
  {id:'construct', br:['box'], title:'Конструктив',
   hint:v=>isOther(v)
     ?'<p>Обери категорію — вона визначить, чи ніж на 1 деталь, чи на 2 (кришка + дно). Немає підходящої — «Своя категорія»: вкажи назву й конструкцію сам.</p>'
     :'<p>Обери категорію, потім розмір ножа зі списку. Формат підтягнеться в ТЗ сам.</p>',
   fields:v=>{
     const f=[{k:'manual',label:'Інше — вказати розмір вручну',type:'checkbox'}];
     if(!v.cat) v.cat=FORMAT_CATS[0].cat;
     f.push({k:'cat',label:'Категорія',type:'chips',opts:v.manual?[...FORMAT_CATS.map(g=>g.cat),OTHER_CAT]:FORMAT_CATS.map(g=>g.cat)});
     if(!v.manual){
       const items=(FORMAT_CATS.find(g=>g.cat===v.cat)||{items:[]}).items;
       f.push({k:'fmt',label:'Розмір / ніж',type:'select',opts:items.map(i=>i.name)});
     }else if(v.cat===OTHER_CAT){
       f.push({k:'catCustom',label:'Назва категорії',type:'text',ph:'напр. Тубус'});
       f.push({k:'parts',label:'Конструкція',type:'select',opts:PARTS_OPTS});
     }else{
       v.parts=CAT_PARTS[v.cat]===2?PARTS_OPTS[0]:PARTS_OPTS[1];
     }
     f.push({k:'dims',label:'Розмір Д×Ш×В, мм',type:'text',ph:'200×100×50'});
     return f;
   }},
  {id:'construct', br:['bag'], title:'Розмір пакета',
   hint:v=>isOther(v)?'<p>Вкажи розмір вручну.</p>':'<p>Обери ніж зі списку. Формат підтягнеться в ТЗ сам.</p>',
   fields:v=>[{k:'manual',label:'Інше — вказати розмір вручну',type:'checkbox'},
           {k:'fmt',label:'Ніж / формат з бази',type:'select',opts:fmtOpts('bag'),groups:FORMAT_GROUPS.bag,show:v=>!v.manual},
           {k:'dims',label:'Розмір, мм',type:'text',ph:'Ш×В×Г'}]},
  {id:'material', br:['box'], title:'Матеріал', hint:MAT_BOX_HINT,
   fields:v=>partsOf(v)===2?MAT_FIELDS_2:MAT_FIELDS_1},
  {id:'material', br:['bag'], title:'Матеріал', hint:MAT_BAG_HINT,
   fields:[{k:'mat',label:'Картон',type:'select',opts:MAT_BAG_OPTS}]},
  {id:'layout', br:['box'], title:'Формат',
   hint:v=>isOther(v)?'<p>Формат листа і кількість на лист вказуємо вручну — окремо для кожної деталі, якщо їх дві.</p>':'',
   fields:v=>!isOther(v)?[]:partsOf(v)===2
     ?[{k:'sheetLid',label:'Кришка: формат листа, см',type:'select',opts:SHEET_FORMATS},{k:'upLid',label:'Кришка, шт на лист',type:'number',ph:'3'},
       {k:'sheetBot',label:'Дно: формат листа, см',type:'select',opts:SHEET_FORMATS},{k:'upBot',label:'Дно, шт на лист',type:'number',ph:'2'}]
     :[{k:'sheet',label:'Формат листа, см',type:'select',opts:SHEET_FORMATS},{k:'up',label:'Шт на лист',type:'number',ph:'1'}]},
  {id:'layout', br:['bag'], title:'Формат', hint:v=>isOther(v)?'<p>Формат листа і кількість пакетів на лист вказуємо вручну.</p>':'',
   fields:v=>!isOther(v)?[]:[{k:'sheet',label:'Формат листа, см',type:'select',opts:SHEET_FORMATS},{k:'upBag',label:'Пакетів на лист, шт',type:'chips',opts:[0.5,1]}]},
  {id:'print', br:['box'], title:'Друк', hint:PRINT_HINT, extra:PRINT_EXTRA,
   fields:v=>partsOf(v)===2?PRINT_FIELDS_2:PRINT_FIELDS_1},
  {id:'print', br:['bag'], title:'Друк', hint:PRINT_HINT, extra:PRINT_EXTRA, fields:PRINT_FIELDS_1},
  {id:'lam', br:['box'], title:'Ламінація',
   hint:'<p>Глянцева й матова коштують однаково. Усі інші види (срібло, золото, кольорова, софт-тач) — дорожчі.</p>',
   fields:v=>partsOf(v)===2?LAM_FIELDS_2:LAM_FIELDS_1},
  {id:'lam', br:['bag'], title:'Ламінація',

function load(){

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('uk-UA');
const stepsFor=br=>STEPS.filter(s=>s.br.includes(br));
const visibleSteps=(br,v)=>stepsFor(br).filter(s=>!(s.hidden&&s.hidden(v)));
const fieldsOf=(s,v)=>typeof s.fields==='function'?s.fields(v):s.fields;
const hintOf=(s,v)=>typeof s.hint==='function'?s.hint(v):s.hint;
const clicheOf=(s,v)=>typeof s.cliche==='function'?s.cliche(v):s.cliche;

function fieldHTML(br,f){
  const v=S[br].v[f.k]??'';
  if(f.type==='checkbox'){
    return `<label class="f checkbox" data-f="${f.k}"><input type="checkbox" data-k="${f.k}"${v?' checked':''}> ${esc(f.label)}</label>`;
  }
  let ctrl;
  if(f.groups){
    ctrl=`<select data-k="${f.k}">${f.groups.map(g=>{
      const opts=g.opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('');
      return g.label?`<optgroup label="${esc(g.label)}">${opts}</optgroup>`:opts;
    }).join('')}</select>`;
  }else if(f.type==='select'){
    ctrl=`<select data-k="${f.k}">${f.opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }else if(f.type==='chips'){
    ctrl=`<div class="chiprow" data-chip="${f.k}">${f.opts.map(o=>`<button type="button" data-v="${o}"${String(o)===String(v)?' class="active"':''}>${o}</button>`).join('')}</div>`;
  }else{
    ctrl=`<input type="${f.type}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.type==='number'?' min="0" inputmode="decimal"':''}>`;
  }
  return `<label class="f" data-f="${f.k}">${esc(f.label)}${ctrl}</label>`;
}

function render(br){
  const col=document.querySelector(`.col[data-br="${br}"]`), v=S[br].v;
  // initialise select/checkbox defaults across ALL steps (incl. hidden ones) so fields
  // that later steps' visibility depends on (e.g. v.cat) are set before filtering
  stepsFor(br).forEach(s=>fieldsOf(s,v).forEach(f=>{
    if((f.type==='select'||f.groups)&&!f.opts.includes(v[f.k])) v[f.k]=f.default!=null?f.default:f.opts[0];
    else if(f.type==='checkbox'&&v[f.k]==null) v[f.k]=f.default??false;
  }));
  if(!isOther(v)) applyFormat(br);
  const list=visibleSteps(br,v);
  col.innerHTML=`<div class="colhead"><h2>${br==='box'?'Коробка':'Пакет'}</h2></div>
  <ol class="steps">${list.map((s,i)=>`<li class="step" data-step="${s.id}">
    <div class="stephead"><span class="num">${i+2}</span><h3>${s.title}</h3></div>
    <div class="hint">${hintOf(s,v)}</div>
    <div class="fields">${fieldsOf(s,v).map(f=>fieldHTML(br,f)).join('')}</div>
    ${s.extra||''}<div class="out"></div></li>`).join('')}</ol>
  <div class="tz"><header><button class="btn small" data-copy>Скопіювати ТЗ</button></header><pre></pre></div>`;
  update(br);
}

function applyFormat(br){
  const v=S[br].v, f=(FORMATS[br]||[]).find(x=>x.name===v.fmt);
  if(!f) return;
  v.manual=false;
  if(br==='box') v.parts=f.parts===1?PARTS_OPTS[1]:PARTS_OPTS[0];
  ['dims','knife','upLid','upBot','upBag','up','sheet','sheetLid','sheetBot'].forEach(k=>{if(f[k]!=null) v[k]=String(f[k])});
}

function update(br){
  const col=document.querySelector(`.col[data-br="${br}"]`), v=S[br].v, list=visibleSteps(br,v);
  list.forEach(s=>{
    const li=col.querySelector(`[data-step="${s.id}"]`);
    const flds=fieldsOf(s,v);
    flds.forEach(f=>{
      li.querySelector(`[data-f="${f.k}"]`).hidden=f.show?!f.show(v):false;
      if(f.type==='chips') li.querySelectorAll(`[data-chip="${f.k}"] button`).forEach(b=>b.classList.toggle('active',b.dataset.v===String(v[f.k]||'')));
    });
    const out=li.querySelector('.out');
    if(s.cliche){
      const groups=clicheOf(s,v).map(g=>{
        const on=g.emb&&g.emb!==EMB_OPTS[0], w=parseFloat(g.w), h=parseFloat(g.h), ok=on&&w>0&&h>0;
        return {label:g.label,on,ok,w,h,area:ok?+(w*h).toFixed(2):0,cost:ok?+(w*h*CLICHE_PRICE).toFixed(2):0};
      });
      const active=groups.filter(g=>g.on), missing=active.filter(g=>!g.ok), ready=active.filter(g=>g.ok);
      if(!active.length) out.innerHTML='';
      else if(missing.length) out.innerHTML=`<div class="note warn"><b>Вкажіть розмір тиснення вручну</b>${missing.map(g=>g.label?` (${g.label})`:'').join('')} — ширина і висота, см. Без нього не порахувати кліше.</div>`;
      else{
        const totalArea=+ready.reduce((a,g)=>a+g.area,0).toFixed(2), totalCost=+ready.reduce((a,g)=>a+g.cost,0).toFixed(2);
        out.innerHTML=ready.length>1
          ?`<div class="calc">${ready.map(g=>`<div>Кліше${g.label?' ('+g.label+')':''} ${fmt(g.w)}×${fmt(g.h)} см = ${fmt(g.area)} см²</div>`).join('')}<div class="big">${fmt(totalCost)} грн</div><div class="sub">Разом ${fmt(totalArea)} см²</div></div>`
          :`<div class="calc"><div>Кліше ${fmt(ready[0].w)}×${fmt(ready[0].h)} см = ${fmt(ready[0].area)} см²</div><div class="big">${fmt(ready[0].cost)} грн</div></div>`;
      }
    }
  });
  col.querySelector('.tz pre').textContent=tz(br);
}

function lamWord(type){ return LAM_OUT[type]||type.toLowerCase(); }
function lamLine(v,which){
  const out=v['lam'+which+'Out'], inn=v['lam'+which+'In'];
  const outOn=out&&out!==LAM_OPTS[0], inOn=inn&&inn!==LAM_OPTS[0];
  if(!outOn&&!inOn) return null;
  if(outOn&&inOn) return out===inn?`${lamWord(out)} двостороння`:`${lamWord(out)} ззовні + ${lamWord(inn)} всередині`;
  return `${lamWord(outOn?out:inn)} ${outOn?'зовнішня':'внутрішня'}`;
}
function embLine(v,which){
  const type=v['emb'+which];
  if(!type||type===EMB_OPTS[0]) return null;
  const w=parseFloat(v['emb'+which+'W']), h=parseFloat(v['emb'+which+'H']);
  if(!(w>0&&h>0)) return EMB_OUT[type]||type.toLowerCase();
  const cost=+(w*h*CLICHE_PRICE).toFixed(2);
  return `${EMB_OUT[type]||type.toLowerCase()} ${w}×${h}см (${fmt(cost)} грн)`;
}
function printSide(v,which,dir){
  const type=v['print'+which+dir];
  if(!type||type==='Немає') return null;
  let n=0; const labels=[];
  if(type==='CMYK'||type==='CMYK + Пантони'){ n+=Math.max(1,parseInt(v['print'+which+dir+'CmykN'],10)||4); labels.push('CMYK'); }
  if(type==='Пантони'||type==='CMYK + Пантони'){ const c=Math.max(1,parseInt(v['print'+which+dir+'PmsN'],10)||1); n+=c; labels.push(c>1?`${c}x Pantone`:'Pantone'); }
  return {n,label:labels.join(' + ')};
}
function printLine(v,which){
  const out=printSide(v,which,'Out'), inn=printSide(v,which,'In');
  if(!out&&!inn) return null;
  const labels=[...new Set([out,inn].filter(Boolean).map(x=>x.label))];
  return `${out?out.n:0}+${inn?inn.n:0} (${labels.join(' + ')})`;
}
function bagBottom(dims){
  const nums=(dims||'').match(/\d+(?:[.,]\d+)?/g);
  if(!nums||nums.length<2) return null;
  const r=x=>{const n=Math.max(0,parseFloat(x.replace(',','.'))-6);return Number.isInteger(n)?n:+n.toFixed(1)};
  return `${r(nums[0])}×${r(nums[1])}`;
}
function handleLine(v){
  if(!v.hType||v.hType==='Без ручок') return null;
  const len=parseFloat(v.hLen)>0?`${v.hLen}м`:'';
  if(v.hType==='Стрічка'){
    const w=parseFloat(v.hWid)>0?` (${v.hWid}мм)`:'';
    const head=`${(v.ribMat||'').toLowerCase()} ${v.hCol||''}${w}`.replace(/\s+/g,' ').trim();
    const fix=v.ribFix==='Вклеєна'?'поклейка':(v.ribFix||'').toLowerCase();
    const tail=[len,fix].filter(Boolean).join(' + ');
    return [head,tail].filter(Boolean).join(', ')+(v.hNote?', '+v.hNote:'');
  }
  const head=`шнур${v.hCol?' '+v.hCol:''}`;
  const fix=(v.cordFix||'').toLowerCase();
  const tail=[len,fix].filter(Boolean).join(' + ');
  return [head,tail].filter(Boolean).join(', ')+(v.hNote?', '+v.hNote:'');
}

function ptsWord(n){
  n=Math.abs(Math.round(parseFloat(n)));
  const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return 'точка';
  if(m10>=2&&m10<=4&&(m100<12||m100>14)) return 'точки';
  return 'точок';
}

function tz(br){
  const v=S[br].v, isBox=br==='box', parts2=isBox&&partsOf(v)===2;
  const L=[], push=(label,val)=>{if(val) L.push(`${label}: ${val}`)};

  const noMd=s=>String(s||'').replace(/\*/g,'×'); // Telegram трактує *text* як курсив
  const headName=noMd((!isOther(v)&&v.fmt)?v.fmt:v.dims);
  L.push(`${isBox?'Коробка':'Пакет'}${headName?' '+headName:''}`);
  if(S.qty) L.push(`Тираж ${fmt(S.qty)}шт`);
  L.push('');

  function block(label,matK,sheetK,upK,printWhich,lamWhich,embWhich,glueK,fixedGlueAfter){
    push(label,v[matK]);
    push('ФОРМАТ', v[sheetK]&&parseFloat(v[upK])>0?`${v[sheetK]}, ${v[upK]}шт`:'');
    push('ДРУК', printLine(v,printWhich));
    push('ЛАМІНАЦІЯ', lamLine(v,lamWhich));
    if(v['lac'+embWhich]) L.push('ВИБІРКОВИЙ ЛАК');
    push('ТИСНЕННЯ', embLine(v,embWhich));
    if(glueK) push('ПОКЛЕЙКА', parseFloat(v[glueK])>0?`${v[glueK]} ${ptsWord(v[glueK])}`:'');
    L.push('ВИСІЧКА');
    if(fixedGlueAfter) L.push('ПОКЛЕЙКА');
  }

  if(parts2){
    const noGlue=GLUE_NONE_CATS.includes(v.cat), penal=GLUE_FIXED_CATS.includes(v.cat);
    block('КРИШКА','matLid','sheetLid','upLid','Lid','Lid','Lid',(noGlue||penal)?null:'glueLidPts',penal);
    L.push('');
    block('ДНО','matBot','sheetBot','upBot','Bot','Bot','Bot',(noGlue||penal)?null:'glueBotPts');
  }else{
    block('КАРТОН','mat','sheet',isBox?'up':'upBag','','','');
    if(!isBox){
      const bb=bagBottom(v.dims); push('ДНО', bb?`${bb} + поклейка`:'');
      push('РУЧКИ', handleLine(v));
      push('ПОКЛЕЙКА', v.glueSide||'');
    }else if(!GLUE_NONE_CATS.includes(v.cat)&&parseFloat(v.gluePts)>0){
      L.push(`ПОКЛЕЙКА: ${v.gluePts} ${ptsWord(v.gluePts)}`);
    }
  }

  while(L.length && L[L.length-1]==='') L.pop();
  return L.join('\n');
}

async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(err){
    const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e2){} t.remove();return ok;
  }
}
const tzText=br=>document.querySelector(`.col[data-br="${br}"] .tz pre`).textContent;

async function sendTz(){
  const br=S.branch;
  const text=tzText(br);
  if(tg&&SHARE_MODE){
    tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(APP_URL||'https://t.me')+'&text='+encodeURIComponent(text));
    return;
  }
  const ok=await copyText(text);
  flash(ok?'Скопійовано':'Не вдалось скопіювати');
  if(tg&&tg.HapticFeedback) try{tg.HapticFeedback.notificationOccurred(ok?'success':'error')}catch(e){}
}
function flash(msg){
  document.querySelectorAll('[data-copy]').forEach(b=>{b.textContent=msg});
  if(tg) tg.MainButton.setText(msg);
  setTimeout(()=>{document.querySelectorAll('[data-copy]').forEach(b=>b.textContent='Скопіювати ТЗ');if(tg)tg.MainButton.setText(mainText())},1500);
}

function bind(){

  document.getElementById('qtyQuick').addEventListener('click',e=>{
    const b=e.target.closest('button[data-v]'); if(!b)return;
    qty.value=b.dataset.v; S.qty=qty.value; save(); markQtyActive(); update('box'); update('bag');
  });
  document.querySelectorAll('.col').forEach(col=>{
    const br=col.dataset.br;
    col.addEventListener('input',e=>{
      const k=e.target.dataset.k; if(!k)return;
      S[br].v[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
      if(k==='glueSide') S[br].v.glueSide_touched=true;
      if(k==='fmt'){applyFormat(br);save();render(br);return}
      if(k==='parts'||k==='manual'){save();render(br);return}
      save(); update(br);
    });
    col.addEventListener('click',e=>{
      const chipBtn=e.target.closest('[data-chip] button');
      if(chipBtn){
        const k=chipBtn.closest('[data-chip]').dataset.chip;
        S[br].v[k]=chipBtn.dataset.v;
        if(k==='cat'){ S[br].v.fmt=''; save(); render(br); return; }
        save(); update(br);
        return;
      }
      if(e.target.closest('[data-copy]'))sendTz();
    });
  });
  document.querySelectorAll('button[data-show]').forEach(b=>b.addEventListener('click',()=>setBranch(b.dataset.show)));
  document.getElementById('reset').addEventListener('click',()=>{
    const go=()=>{S=blank();save();qty.value='';markQtyActive();render('box');render('bag');setBranch('box')};
    if(tg) tg.showConfirm('Очистити всі поля і позначки?',ok=>{if(ok)go()});
    else if(confirm('Очистити всі поля і позначки?')) go();
  });
  if(tg){tg.MainButton.setText(mainText());tg.MainButton.show();tg.MainButton.onClick(sendTz)}
}

load().then(state=>{
  S=state; qty.value=S.qty;
  render('box'); render('bag'); markQtyActive(); bind(); setBranch(S.branch==='bag'?'bag':'box');
});
